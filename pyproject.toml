[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagship-ai-engineer"
version = "0.1.0"
description = "A repository-aware multi-agent AI software engineer prototype"
requires-python = ">=3.12"
dependencies = ["openai>=1.68.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2,<3"]

[project.scripts]
flagship = "flagship.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
